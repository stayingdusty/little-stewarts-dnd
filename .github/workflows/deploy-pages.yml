name: Deploy Knowledge Base to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "knowledge-base-app/**"
      - "DND-Source-Docs/**"
      - "campaigns/**"
      - "AGENTS.md"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "knowledge-base-app/**"
      - "DND-Source-Docs/**"
      - "campaigns/**"
      - "AGENTS.md"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build, validate, and test knowledge base
        working-directory: knowledge-base-app
        run: npm run verify

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: knowledge-base-app/site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
