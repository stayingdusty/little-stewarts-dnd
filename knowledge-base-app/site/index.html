<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Stewarts Knowledge Base</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Little Stewarts Knowledge Base</h1>
      <p>Globally searchable player knowledge for characters, NPCs, locations, inventory, and completed playthrough events.</p>
    </header>

    <main class="layout">
      <section class="controls">
        <label for="searchInput">Search everything</label>
        <input id="searchInput" type="search" placeholder="Type a name, tag, detail, or chapter..." />

        <div class="nav-card" aria-label="Source document navigation">
          <div class="nav-card__heading">
            <div class="nav-card__title">Source docs</div>
            <button id="navToggle" class="nav-card__toggle" type="button" aria-expanded="false" aria-controls="sourceDocNav">
              <span class="nav-card__toggle-icon">☰</span>
              <span class="nav-card__toggle-text">Browse source docs</span>
            </button>
          </div>
          <p class="nav-card__hint">Browse player-safe character sheets and completed playthrough summaries.</p>
          <div id="sourceDocNav" class="source-doc-nav" hidden></div>
        </div>

        <label for="domainFilter">Filter domain</label>
        <select id="domainFilter">
          <option value="all">All</option>
          <option value="character">Characters</option>
          <option value="npc">NPCs</option>
          <option value="location">Locations</option>
          <option value="inventory-item">Inventory Items</option>
          <option value="canon">Canon Events</option>
        </select>
      </section>

      <section>
        <p id="resultCount" class="result-count"></p>
        <div id="results" class="results"></div>
      </section>
    </main>

    <template id="resultCardTemplate">
      <article class="card">
        <div class="card-head">
          <h2 class="card-title"></h2>
          <span class="pill"></span>
        </div>
        <p class="card-summary"></p>
        <p class="card-tags"></p>
        <p class="card-source"></p>
      </article>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
