<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Stewarts Knowledge Base</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Little Stewarts Knowledge Base</h1>
      <p>Globally searchable canon for characters, NPCs, locations, encounters, lore, secrets, and playthrough events.</p>
    </header>

    <main class="layout">
      <section class="controls">
        <label for="searchInput">Search everything</label>
        <input id="searchInput" type="search" placeholder="Type a name, tag, detail, or chapter..." />

        <label for="domainFilter">Filter domain</label>
        <select id="domainFilter">
          <option value="all">All</option>
          <option value="character">Characters</option>
          <option value="npc">NPCs</option>
          <option value="location">Locations</option>
          <option value="encounter">Encounters</option>
          <option value="lore">Lore</option>
          <option value="secret">Secrets</option>
          <option value="inventory-item">Inventory Items</option>
          <option value="canon">Canon Events</option>
        </select>
      </section>

      <section>
        <p id="resultCount" class="result-count"></p>
        <div id="results" class="results"></div>
      </section>
    </main>

    <template id="resultCardTemplate">
      <article class="card">
        <div class="card-head">
          <h2 class="card-title"></h2>
          <span class="pill"></span>
        </div>
        <p class="card-summary"></p>
        <p class="card-tags"></p>
        <p class="card-source"></p>
      </article>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
